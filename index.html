html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font-body);color:#000}

svg{display:block}

.decor{position:absolute;width:clamp(60px,13vmin,110px);transform:translate(-50%,-50%);pointer-events:none;animation:sway 5s ease-in-out infinite}

.sp{position:absolute;width:11px;height:11px;background:#fff;pointer-events:none;animation:tw 2.8s ease-in-out infinite;

@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}

.pad{position:absolute;width:clamp(62px,15vmin,100px);aspect-ratio:100/80;transform:translate(-50%,-50%);
  cursor:pointer;border:0;padding:0;background:none;font:inherit;z-index:2}
.pad svg{width:100%;height:100%;overflow:visible}
.pad b{position:absolute;inset:0;display:grid;place-items:center;padding-top:6%;font-weight:400;color:#000;

.pad.next{animation:glow 1.3s ease-in-out infinite}
.pad.locked{cursor:not-allowed}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #ffb3e1)}50%{filter:drop-shadow(0 0 8px #ff8fd0) drop-shadow(0 0 16px #ffe27a)}}

#frog{position:absolute;width:clamp(48px,10.5vmin,72px);transform:translate(-50%,-64%);z-index:5;pointer-events:none;

#frog span{display:block}
#frog.hop span{animation:hop .7s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-38px) scale(.9,1.12)}60%{transform:translateY(-32px)}100%{transform:translateY(0) scale(1.1,.9)}}

#hint{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:68px;right:16px;text-align:center;z-index:6;pointer-events:none}

#mute .slash{display:none}

#overlay{position:fixed;inset:0;background:rgba(120,90,180,.35);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}

#fairy svg{width:100%;height:100%}
@keyframes float{50%{transform:translateX(-50%) translateY(-7px)}}
.wing{transform-origin:45px 50px;animation:flap .5s ease-in-out infinite alternate}
.wing.r{animation-direction:alternate-reverse}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.82)}}
#tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}

#content{overflow:auto;line-height:2;font-size:17px;min-height:90px;color:#000}
#content a{color:#000;text-decoration:underline wavy #ff8fbf;text-underline-offset:4px}
#ok{margin:14px auto 0;font:inherit;font-family:var(--font-title);font-size:18px;padding:8px 30px;border:3px solid #fff;border-radius:18px;

#ok:active{transform:translateY(3px);box-shadow:0 1px 0 #e6b43f}
.lang{position:absolute;z-index:1;font-family:var(--font-title);font-size:13px;color:#000;border:2px solid #fff;border-radius:14px;padding:4px 10px;cursor:pointer;

@keyframes bob{50%{transform:translate(-50%,-50%) translateY(-5px)}}
.lang.got{animation:gotit .35s forwards}
@keyframes gotit{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.lang.win{z-index:3;transform:none;animation:none;opacity:.92}
.lang.win.got{animation:gotw .35s forwards}
@keyframes gotw{to{transform:scale(1.8);opacity:0}}
.p-bl{bottom:8px;left:14px}.p-br{bottom:8px;right:14px}.p-tl{top:-16px;left:18px}.p-sr{right:-14px;top:55%}.p-sl{left:-14px;top:38%}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:40;background:#fff;border:3px solid #ffc9e3;

#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const POS = [

const padEls=[];

(function(){
  let d='M'+POS[0].join(' ');

    const mx=(POS[i][0]+POS[i+1][0])/2, my=(POS[i][1]+POS[i+1][1])/2;

  }
  d+=' L'+POS[POS.length-1].join(' ');

  let p='<ellipse cx="50" cy="70" rx="42" ry="9" fill="url(#gp)" stroke="#2f9a63" stroke-width="2"/>';
  [-64,-34,34,64].forEach(a=>p+='<ellipse cx="50" cy="46" rx="11" ry="27" transform="rotate('+a+' 50 70)" fill="#ffc9e3" stroke="#ff9fcb" stroke-width="1.5"/>');
  [-16,16].forEach(a=>p+='<ellipse cx="50" cy="44" rx="11" ry="28" transform="rotate('+a+' 50 70)" fill="#ffdcec" stroke="#ff9fcb" stroke-width="1.5"/>');
  p+='<ellipse cx="50" cy="42" rx="11" ry="29" fill="#fff0f7" stroke="#ff9fcb" stroke-width="1.5"/><circle cx="50" cy="58" r="4" fill="#ffd23f"/>';
  return '<svg viewBox="0 0 100 80">'+p+'</svg>';
}

  const el=document.createElement('div'); el.className='decor';

const PADSVG='<svg viewBox="0 0 100 80"><ellipse cx="52" cy="50" rx="46" ry="30" fill="#6fbfd6" opacity=".35"/>'+

POS.forEach((p,i)=>{

  b.innerHTML=PADSVG+'<b>'+(i+1)+'</b>';
  b.addEventListener('click',()=>tryHop(i+1));
  pond.appendChild(b); padEls.push(b);
});

function place(x,y){frog.style.left=x+'%';frog.style.top=y+'%';}

function refresh(){
  padEls.forEach((el,i)=>{
    const n=i+1;
    el.classList.toggle('next',!busy&&!free&&n===current+1);
    el.classList.toggle('locked',!free&&n!==current+1);
  });
  const t=busy?'':free?'حالا آزادی! هر برگی رو که دوست داری انتخاب کن 🐸':current===0?'روی برگ شمارهٔ ۱ بزن تا قورباغه بپره':'برگ بعدی رو انتخاب کن';
  hint.innerHTML=t?'<span>'+t+'</span>':'';
  pondLangs.forEach(e=>{e.style.display=(!found.has(e.textContent)&&current>=+e.dataset.u)?'':'none';});
}

function showModal(tabs,withFairy,cb,padNo){
  onClose=cb; let idx=0;
  fairy.style.display=withFairy?'':'none';
  okBtn.style.display=withFairy?'none':'';
  function draw(){
    tabsEl.innerHTML='';
    const vis=tabs.length>1||(tabs[0]&&tabs[0].title);
    tabsEl.style.display=vis?'flex':'none';
    if(vis) tabs.forEach((t,i)=>{
      const bt=document.createElement('button'); bt.textContent=t.title; bt.className=i===idx?'on':'';
      bt.onclick=()=>{idx=i;draw();}; tabsEl.appendChild(bt);
    });
    contentEl.innerHTML=tabs[idx].html;
  }
  draw(); overlay.classList.add('show'); busy=true; refresh(); placeStickers(padNo);
}
function closeModal(){
  overlay.classList.remove('show');
  const cb=onClose; onClose=null;
  if(cb) cb(); else {busy=false;refresh();}
}
fairy.addEventListener('click',closeModal);
okBtn.addEventListener('click',closeModal);

function tryHop(n){
  if(busy) return;
  if(!free&&n!==current+1) return;
  busy=true; refresh();
  const q=POS[n-1];
  frog.classList.remove('hop'); void frog.offsetWidth; frog.classList.add('hop');
  place(q[0],q[1]);
  setTimeout(()=>{
    frog.classList.remove('hop');
    if(!free) current=n;
    showModal(PADS[n-1],true,()=>{
      if(!free&&n===PADS.length){
        showModal([{title:'',html:FINAL.html+countHtml()}],true,()=>{free=true;busy=false;refresh();});
      } else {busy=false;refresh();}
    },n);
  },750);
}


const muteBtn=document.getElementById('mute');
if(!MUSIC_URL){ muteBtn.style.display='none'; }
else{
  const audio=new Audio(MUSIC_URL); audio.loop=true; audio.volume=.5;
  let started=false;
  const start=()=>{ if(started) return; audio.play().then(()=>{started=true;document.removeEventListener('pointerdown',start);}).catch(()=>{}); };
  document.addEventListener('pointerdown',start);
  muteBtn.addEventListener('click',()=>{ audio.muted=!audio.muted; muteBtn.classList.toggle('muted',audio.muted); });
}


const L_TOTAL=17;
const HP=[["Rust",4,30],["Go",96,68],["R",54,95],["SQL",66,8],["C",34,30],["PHP",88,36],["Ruby",60,42],["Swift",3,52],["Kotlin",74,58],["HTML",50,54],["MATLAB",20,34]];
const HW={2:["Python","bl"],4:["Java","sr"],6:["C++","tl"],8:["JavaScript","br"],9:["C#","sl"],11:["TypeScript","bl"]};
const found=new Set();
const toastEl=document.createElement('div'); toastEl.id='toast'; document.body.appendChild(toastEl);
let toastT;
function say(n){ toastEl.innerHTML='✨ <bdi dir="ltr">'+n+'</bdi> پیدا شد!'; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1500); }
function mk(name,cls){
  const e=document.createElement('button'); e.className='lang '+cls; e.dir='ltr'; e.textContent=name;
  e.style.background='hsl('+((name.length*47+name.charCodeAt(0)*13)%360)+' 85% 86% / .8)';
  e.onclick=ev=>{ ev.stopPropagation(); if(found.has(name)) return; found.add(name); e.classList.add('got'); say(name); setTimeout(()=>e.remove(),350); };
  return e;
}
const pondLangs=HP.map((h,i)=>{ const e=mk(h[0],'pl'); e.style.left=h[1]+'%'; e.style.top=h[2]+'%'; e.dataset.u=i; e.style.animationDelay=(i*.4)+'s'; pond.appendChild(e); return e; });
function placeStickers(n){
  const bx=document.getElementById('box');
  bx.querySelectorAll('.lang').forEach(x=>x.remove());
  const w=HW[n];
  if(w&&!found.has(w[0])) bx.appendChild(mk(w[0],'win p-'+w[1]));
}
function countHtml(){
  const k=found.size;
  const t=k>=L_TOTAL?'🎉 هر ۱۷ زبان برنامه‌نویسیِ پنهان رو پیدا کردی!':'🔍 تعداد زبان‌های برنامه‌نویسیِ پنهانی که پیدا کردی: '+k.toLocaleString('fa')+' از '+L_TOTAL.toLocaleString('fa');
  return '<div style="text-align:center;margin-top:16px;font-size:18px">'+t+'</div>';
}


showModal([WELCOME],false,()=>{busy=false;refresh();});
const splash=document.getElementById('splash');
requestAnimationFrame(()=>splash.classList.add('show'));
const hideSplash=()=>{ splash.classList.remove('show'); setTimeout(()=>splash.remove(),800); };
setTimeout(hideSplash,3700);   
splash.addEventListener('click',hideSplash);
